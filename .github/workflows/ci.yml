name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: install
        run: pip install pytest import-linter "mcp==2.3.0"
      - name: verify
        run: python -m pytest tests/ -q
